    function parseRef(ref) {
      const spaceIndex = ref.lastIndexOf(' ');
      const code = ref.slice(0, spaceIndex);
      const spec = ref.slice(spaceIndex + 1);
      const [fromRaw, toRaw] = spec.split('-');
      const from = Number(fromRaw);
      const to = toRaw ? Number(toRaw) : from;
      const book = BOOKS[code];
      const count = Math.max(0, to - from + 1);
      const chapters = from === to ? `${from}` : `${from}–${to}`;
      return {
        code,
        name: book ? book.name : code,
        from,
        to,
        count,
        chapters,
        label: `${book ? book.name : code} ${chapters}`,
        ref,
      };

      "55": "Небесные сокровища вверяются земным сосудам не за их ценность, а ради проявления преизбыточной силы Бога.",
      "56": "Мертвая обрядовость питает гордыню, но живая вера в крови Христа сокрушает всякую преграду.",
      "57": "Исповедание Петра основано на скале Откровения: Христос есть Сын Бога Живого и наша Праведность.",
      "58": "Священство Христа по чину Мелхиседека вечно и несокрушимо, ибо оно основано на силе непрестающей жизни.",
      "59": "Субботний покой — это прекращение наших собственных мертвых дел и вход в совершенный покой Христа.",
      "60": "Всесожжение указывает на Христа, отдавшего Себя без остатка за нас, и призывает нас к полной капитуляции.",
      "61": "Мирная жертва утверждает наш нерушимый мир с Богом, купленный не серебром, а драгоценной Кровью.",
      "62": "Перенос греха на жертву в древности наглядно пророчествовал о великом Замещении на Голгофе.",
      "63": "Благодарность искупленных — это благоуханное кадило, возносимое к престолу за совершенное спасение.",
      "64": "Огонь с небес подтверждает угодность жертвы: наше принятие у Бога основано на жертве Христа.",
      "65": "Чистота жизни — это не маска благочестия, а естественный аромат присутствия Христа в сердце.",
      "66": "Проказа греха неизлечима силами человека, но прикосновение Великого Врача исцеляет мгновенно.",
      "67": "Всякое упование на плоть оканчивается крахом; лишь упование на Христа приносит несокрушимую победу.",
      "68": "День очищения небесного святилища завершает историю греха: наши имена записаны на сердце Первосвященника.",
      "69": "Кровь есть жизнь души; отдав Свою кровь на кресте, Христос подарил нам Свою собственную безгрешную жизнь.",
      "70": "Святость заповедей не пугает оправданного грешника, ибо Дух Святой записывает их в глубине сердца.",
      "71": "Любить ближнего возможно лишь тогда, когда мы ежедневно пьем из неиссякаемого источника Божьей любви.",
      "72": "Взирая на распятого Спасителя на знамени креста, мы побеждаем любые полчища сомнений и страхов.",
      "73": "Неверие лишает человека обетований, но упование на верность Бога открывает вражбу в земную ханаанскую жизнь.",
      "74": "Прощение братьям изливается из нашего собственного переполненного сердца, познавшего глубину Божьей милости.",
      "75": "Праздники Господни раскрывают этапы великого плана искупления человечества от рабства греха.",
      "76": "Светильник Божьего слова горит елеем Духа Святого, освещая нам узкий путь в небесное отечество.",
      "77": "Юбилейный год провозглашает абсолютное освобождение от всяких цепей греха и возвращение к нашему Наследству.",
      "78": "Брачный пир Царя наполнен не зваными гордецами, а нищими, одетыми в одежды царской праведности.",
      "79": "Вода из скалы напоминает: в самые сухие моменты жизни благодать Христа готова утолить нашу жажду.",
      "80": "Взирая на медного змея, мы исцеляемся от смертельных укусов греха простым актом упования на Христа.",
      "81": "Никакие проклятия мира не имеют силы над тем, кого Бог благословил Своей вечной праведностью.",
      "82": "Человеческое коварство бессильно перед лицом Божественного провидения, охраняющего Своих детей.",
      "83": "Звезда от Иакова возвещает рассвет воскресения: во Христе мы имеем гарантию бессмертия.",
      "84": "Ревность по Боге означает ревность по Его чистоте и спасающей благодати против мертвой формы.",
      "85": "Наш Первосвященник сострадает нашим немощам, ибо Сам искушен во всем, кроме греха.",
      "86": "Твердость Божьего обетования — это якорь для души, удерживающий нас в бушующем житейском море.",
      "87": "Прикосновение веры извлекает из сокровищницы Христа исцеление, мир и полноту жизни.",
      "88": "Хлеб жизни, сшедший с небес, подкрепляет нас в странствии к небесному Сиону.",
      "89": "Кровь вечного завета соделала нас совершенными во Христе пред лицом Святого Бога.",
      "90": "Живая вера никогда не бывает бездейственной; она естественным образом рождает плоды праведности.",
      "91": "Память о Божьих избавлениях в прошлом укрепляет нашу веру для побед в настоящем.",
      "92": "Наша крепость — не стены и не богатства, а живое присутствие Господа Саваофа посреди нас.",
      "93": "Торжество Божественной любви являет миру несокрушимую мощь Его спасающей десницы.",
      "94": "Единство закона и любви сияет в Завете: Бог требует любви, потому что Сам есть Любовь.",
      "95": "Закон в сердце — это не свод запретов, а живой характер Христа, отображенный в нашем внутреннем человеке.",
      "96": "Любить Бога всем сердцем возможно лишь тогда, когда мы первыми позволили Ему возлюбить нас.",
      "97": "Избрание во Христе основано не на наших достоинствах, а на суверенной и непостижимой милости Отца.",
      "98": "Не хлебом единым жив человек, но каждым словом, исходящим из уст Божественной благодати.",
      "99": "Осознание собственной нищеты открывает дверь для бесконечного проявления Божьей праведности.",
      "100": "Города убежища громко проповедуют о Христе — нашем надежном и вечном убежище от мщения закона.",
      "101": "Благословение послушания веры приносит в душу глубокий внутренний мир и неизъяснимую радость.",
      "102": "Единство поклонения собирает искупленных у единого Престола Благодати, стирая все земные перегородки.",
      "103": "Прощение долгов ближним — отражение того неизмеримого прощения, которое даровал нам Христос.",
      "104": "Суд истины открывает не погибель верующего, а его полное оправдание по заслугам Христа.",
      "105": "Великий Пророк возвещает волю Отца; отречение от своего «я» открывает слух для Его голоса.",
      "106": "В духовной брани побеждает не наша доблесть, а несокрушимая сила Вождя нашего спасения.",
      "107": "Виноградник Божьей благодати приносит обильный плод там, где вервь послушания соединена с Лозой.",
      "108": "Вход в обетование совершается не силой оружия, а дерзновением веры в обещанное Слово.",
      "109": "Вера Раав доказывает: милость Божья способна спасти любого грешника из любых глубин.",
      "110": "Камнями памяти на нашем пути служат вехи прошлых благословений и совершенных искуплений.",
      "111": "Падение Иерихона учит: стены сомнений рушатся от звука хвалы и простого доверия Богу.",
      "112": "Пришествие Спасителя в мир окружено атмосферой великой радости и простого пастушеского смирения.",
      "113": "Когда солнце останавливается над Гаваоном, мы видим: для Бога нет ничего невозможного в деле спасения.",
      "114": "Родословие благодати включает в себя падших людей, чтобы явить чудо преображающей силы Христа.",
      "115": "Субботний покой — это драгоценный дар Отца, приглашающий нас оставить труды ради спасения и почить в Его любви.",
      "116": "Вера римского сотника обнажает главное: Христу достаточно сказать лишь слово, и душа исцеляется.",
      "117": "Семя живого слова, падая в добрую почву сокрушенного сердца, приносит стократный урожай святости.",
      "118": "Облако свидетелей прошлого подбадривает нас с упованием совершать поприще веры во Христа.",
      "119": "Отцовская любовь Бога превосходит всякое человеческое разумение и отвечает на наши молитвы сверх ожиданий.",
      "120": "Доверие Божественному Промыслу дарует душе невозмутимый мир посреди житейских бурь.",
      "121": "Эпоха судей без царя в голове символизирует состояние души, удалившейся от живого водительства Христа.",
      "122": "Забытый завет ведет к духовной слепоте; призыв к возвращению — это голос сострадающего Спасителя.",
      "123": "Первый избавитель в книге Судей — тень Того Великого Избавителя, Который сокрушил оковы нашего греха.",
      "124": "Сила Божья совершается в немощи: Девора и Барак побеждают врага упованием на Господа.",
      "125": "Песнь победы звучит на устах тех, кто осознал: победу одержал не меч человека, а десница Всевышнего.",
      "126": "Гедеон познает истину: Бог выбирает слабое и ничтожное мира, чтобы посрамить сильное.",
      "127": "Триста безоружных с факелами и трубами — образ евангельского света, сияющего из глиняных сосудов.",
      "128": "Всякое упование на человеческих вождей бренно; наше упование должно быть исключительно на Заступника.",
      "129": "Гордость неизбежно ведет к падению, но смиренные духом удостаиваются великой милости у Бога.",
      "130": "Плач народа о грехе находит отклик у Бога, Который неизменно готов прощать и восстанавливать.",
      "131": "Отверженный миром человек становится орудием спасения в руках Того, Кто смотрит на сокрушенное сердце.",
      "132": "Рождение Самсона напоминает: чудеса Божьей благодати превосходят все природные возможности.",
      "133": "Неисчерпаемый источник живой воды бьет для каждого жаждущего, обратившегося к Спасителю.",
      "134": "Самоверие и надежда на природную силу неизбежно ведут к потере духовного зрения и свободы.",
      "135": "Искупление Руфи чужеземки — прекрасный портрет того, как Христос искупает язычников для Своего Царства.",
      "136": "Милость к моавитянке Руфи открывает универсальность евангельской благодати для всего человечества.",
      "137": "Наш Небесный Родственник-Искупитель (Гоез) добровольно заплатил всю цену за наше выкупление из рабства.",
      "138": "Восстановление из пепла греха — это триумф Божьей любви, поднимающей нищего из гноища.",
      "139": "Молитва Анны прославляет Бога, Который сокрушает гордых и насыщает алчущих духовным хлебом.",
      "140": "Крушение фарисейского законничества открывает путь для принятия живой и исцеляющей праведности.",
      "141": "Святость Божьего присутствия не терпит полумер: ковчег занимает либо первое место, либо никакого.",
      "142": "Требование человеческого царя вместо Бога ведет к разочарованию; наша надежда — в Царе царей.",
      "143": "Послушание веры бесконечно выше любых самых дорогих жертв, принесенных по самоволии плоти.",
      "144": "Бог смотрит не на внешнюю осанку и таланты, а на сокрушенное и преданное Ему сердце.",
      "145": "Победа над великанами нашей жизни совершается исключительно во имя Господа Саваофа.",
      "146": "Завет истинной дружбы во Христе отражает преданность нашего Небесного Друга, положившего за нас жизнь.",
      "147": "Хлебы предложения для алчущего Давида учат нас тому, что закон любви превыше буквы обряда.",
      "148": "Проявление милости к гонителю — подлинный почерк характера Иисуса Христа в нашем сердце.",
      "149": "Мудрость свыше отводит нас от опрометчивых поступков и направляет по стопам мира и благодати.",
      "150": "Поиск ответов у мертвых традиций приносит лишь отчаяние; очищение храма возвращает нас к Источнику.",
      "151": "Чаша страданий Христа в Гефсимании испита до дна, чтобы чаша нашего спасения была наполнена до краев.",
      "152": "Воплощение Слова — это кульминация Божественной любви, пожелавшей жить среди падшего человечества.",
      "153": "Изобилие благодати в Кане символизирует щедрость Христа, Который дает Своим детям самое лучшее.",
      "154": "Рождение свыше — это абсолютное чудо творения Божьего Духа в мертвом доселе человеческом сердце.",
      "155": "Живая вода из уст Христа утоляет жажду мятущейся души, давая ей неиссякаемый источник мира.",
      "156": "Исцеление у купальни Бефезда являет Христа, Который исцеляет безнадежных грешников по Своей благодати.",
      "157": "Хлеб, сошедший с небес, питает нас вечной жизнью. Вкушающий этот Хлеб не умрет вовек.",
      "158": "Реки воды живой, текущие из чрева верующего, — это переливание Духа Святого через спасенную душу.",
      "159": "Свет мира рассеивает мрак обвинений и защищает грешника от осуждения мертвой религии.",
      "160": "Исцеление слепорожденного — это символ духовного просвещения человека светом евангельской истины.",
      "161": "Добрый Пастырь знает каждую Свою овец по имени и ведет ее к зеленым пажитям вечного покоя.",
      "162": "Воскрешение Лазаря громко провозглашает: Христос есть Победитель смерти и Податель жизни.",
      "163": "Пшеничное зерно приносит плод лишь через смерть. Голгофа стала источником нашего бессмертия.",
      "164": "Омовение ног ученикам — великий урок смиренной, жертвенной и созидающей любви нашего Господа.",
      "165": "Обители в доме Отца приготовлены для нас Христом. Наш путь на небеса обеспечен Его Кровью.",
      "166": "Пребывание в Истинной Лозе — это залог обильного плода праведности в нашей повседневной жизни.",
      "167": "Утешитель Дух Святой направляет наши взоры на Христа, открывая нам глубины Его любви.",
      "168": "Первосвященническая молитва Христа о единстве исполняется в тех, кто соединен с Ним единым Духом.",
      "169": "Суд перед Пилатом обнажает слепоту мира и безграничное терпение Невинного Агнца.",
      "170": "Покров Всевышнего окружает каждого, кто доверил свою жизнь Его суверенной и любящей руке.",
      "171": "Суд милосердия и благодати покрывает наши прегрешения совершенной праведностью Иисуса.",
      "172": "Божественная справедливость и защита никогда не оставляют уповающих на Его святое имя.",
      "173": "«Всё от руки Твоей»: осознание этого факта освобождает сердце от жадности и страха.",
      "174": "«Совершилось!» — крик победы на кресте возвестил о том, что закон удовлетворен, а грешник искуплен.",
      "175": "Сила Его воскресения поднимает нас из мертвых дел для хождения в обновленной жизни.",
      "176": "Огненные испытания очищают нашу веру, делая ее драгоценнее испытанного золота.",
      "177": "Драгоценные обетования даны нам для того, чтобы мы соделались причастниками Божественного естества.",
      "178": "Опасность легального обмана разоблачена: спасение совершается верой во Христа, а не делами закона.",
      "179": "Кровь Иисуса Христа, Сына Его, очищает нас от всякого греха без исключения и промедления.",
      "180": "Безграничная любовь Отца даровала нам привилегию называться и быть детьми Божьими.",
      "181": "Совершенная любовь Христа изгоняет всякий мучительный страх перед судом и будущим.",
      "182": "Распятый Царь правит сердцами не с помощью меча, а с помощью неизреченной притягательности Голгофы.",
      "183": "Мудрость от Бога превосходит всю философию мира, указывая на Христа — распятого и воскресшего.",
      "184": "Восстановление Петра у Галилейского моря учит нас исцеляющей силе прощающей любви Учителя.",
      "185": "Слово о кресте для погибающих — безумие, а для нас, спасенных, — это Божия сила.",
      "186": "Дух Святой исследует сокровища Божьи и открывает их нашему смиренному и жаждущему сердцу.",
      "187": "Никакое иное основание не может быть положено, кроме того, которое положено, — это Иисус Христос.",
      "188": "Быть домостроителем тайн благодати — значит с трепетом возвещать людям полноту прощения во Христе.",
      "189": "Христос — наша Пасха, закланная за нас. Очистим старую закваску греха силою Его жизни.",
      "190": "Огненный ответ жертвы на Кармиле доказывает: истинный Бог отвечает огнем Своей любви на призыв веры.",
      "191": "Тихий вей благодати исцеляет израненную душу лучше любых громогласных обвинений закона.",
      "192": "Наша свобода во Христе ограничена лишь одним — законом созидательной и жертвенной любви к ближнему.",
      "193": "Молитва Соломона о мудрости находит полный ответ во Христе, Который сделался для нас Премудростью от Бога.",
      "194": "Жертвенник благодати — это место, где наши немощи поглощаются совершенством Его искупления.",
      "195": "Облако славы наполняет храм нашего сердца, когда мы полностью отдаем себя под водительство Духа.",
      "196": "Огонь Божьей любви воспламеняет наши жертвенники, побуждая нас жить ради прославления Спасителя.",
      "197": "Покой веры освобождает нас от суеты сует и открывает радость созерцания славы Спасителя.",
      "198": "Ликующее прославление Бога рождается из глубокого осознания того, сколь великое спасение нам даровано.",
      "199": "Отказ от личных прав ради благовестия Евангелия — подлинный плод преображенной благодатью жизни.",
      "200": "Отречение от упования на свои силы — главный залог духовного преуспевания во Христе.",
      "201": "Всему свое время, но во Христе мы имеем Вечность, вложенную в наши сокрушенные сердца.",
      "202": "Множество членов составляют единое тело Церкви, где каждый питается от Живой Главы — Христа.",
      "203": "Полнота добродетели — это сияние характера Иисуса Христа, отраженного в спасенном человеке.",
      "204": "Гимн любви превосходит все духовные дары: без любви самая яркая деятельность превращается в пустышку.",
      "205": "Понятность евангельской вести открывает доступ к спасению самым простым и неученым людям.",
      "206": "Победа воскресения разрушает последние оковы страха перед физической смертью.",
      "207": "Любовь Христа к нам сильна как смерть; воды многих скорбей не могут потушить ее.",
      "208": "Поиск Возлюбленного приводит нас к глубокому переживанию Его близости и сокровенного мира.",
      "209": "Запечатанный сад души благоухает ароматами праведности, когда в нем владычествует Дух Святой.",
      "210": "Обличающий свет истины обнажает лицемерие, чтобы исцелить сердце искренним покаянием.",
      "211": "Гора Господня открыта для всех народов; Божья милость простирается до краев земли.",
      "212": "Тайна беззакония разбивается о созидательную силу и явление пришествия нашего Спасителя.",
      "213": "Вознесение Христа открыло нам путь во святилище, а излияние Духа дало силу для свидетельства.",
      "214": "Пятидесятница — это триумф евангельской вести, покоряющей сердца силой распятого Христа.",
      "215": "Исцеление хромого во имя Иисуса свидетельствует: сила исцеления принадлежит нашему воскресшему Господу.",
      "216": "Имя Иисуса — единственное имя под небом, данное человекам, которым надлежит нам спастись.",
      "217": "Чистота совести и дерзновение веры рождаются от созерцания совершенной жертвы Христа.",
      "218": "Служение апостолов, полное благодати и силы, вдохновляет нас быть верными свидетелями истины.",
      "219": "Стефан в минуту мученичества видит открытые небеса: Христос стоит, приветствуя Своего верного воина.",
      "220": "Гонения не могут остановить Евангелие; они лишь рассеивают семена благодати по всей земле.",
      "221": "В темные дни испытаний горячая молитва веры способна изменить ход истории и продлить жизнь.",
      "222": "Обретение Книги Закона производит искреннее сокрушение и возрождает жажду жить по Слову.",
      "223": "Духовная реформа начинается не с предписаний властей, а с покаянного возвращения к Богу Израиля.",
      "224": "Падение Иерусалима напоминает о неизбежности суда над отвергнутой благодатью.",
      "225": "Нежная погоня Божьей любви преследует отступника, чтобы вернуть его в объятия Отца.",
      "226": "Цена нашего искупления — не тленное золото, а безграничная жертвенная любовь Христа.",
      "227": "Неведение Бога ведет к моральному краху; познание Его характера преображает естество.",
      "228": "Призыв возвратиться к Истцелителю звучит для каждого, кто ушел на страну далекую.",
      "229": "Господь ищет сокрушенной любви сердца, а не механического исполнения внешних жертв.",
      "230": "Посевы нашего эгоизма приносят горькие плоды бури; лишь милость Божья способна исцелить отступничество.",
      "231": "В огне тягостей и скорбей Господь очищает нашу веру от шлаков самонадеянности.",
      "232": "Опустошение земных опор обращает наши взоры к вечному и несокрушимому Царству Христа.",
      "233": "Разделенное сердце не может служить Богу; полное посвящение приносит мир и исцеление.",
      "234": "Узы Божьей любви удерживают нас эффективнее любых страхов перед наказанием.",
      "235": "Борьба за благословение у источника благодати завершается победой смиренной веры.",
      "236": "Жало смерти побеждено на Голгофе: во Христе мы имеем абсолютную гарантию бессмертия.",
      "237": "Исцеление отступничества совершается даром: Бог сам врачует наши раны Своей благодатью.",
      "238": "Реки правосудия и милосердия сливаются на кресте, даруя грешнику полное оправдание.",
      "239": "Утешение во всякой скорби дается нам из избытка утешения, которым Христос утешил нас.",
      "240": "Приготовление к встрече с Богом — это облачение в одежды Его совершенной праведности.",
      "241": "Живое письмо Христа пишется Духом Святым на скрижалях человеческого сердца.",
      "242": "Сокровище евангельской благодати сияет особенно ярко сквозь хрупкость наших глиняных сосудов.",
      "243": "Обращение Савла — величайший триумф благодати над человеческой яростью и самоправедностью.",
      "244": "Бог нелицеприятен: Его спасающая благодать в равной степени открыта для всякого алчущего.",
      "245": "Виноградник Божьей благодати приносит обильные плоды радости для всех народов земли.",
      "246": "Эммануил — значит «с нами Бог». Эта реальность рассеивает любой мрак одиночества и страха.",
      "247": "Младенец в яслях Вифлеема — это воплотившийся Творец вселенной, ставший нашим Братом.",
      "248": "Отрасль от корня Иессея приносит миру долгожданный мир и несокрушимую правду.",
      "249": "Спасение совершается исключительно по благодати через веру, и это не от нас — Божий дар.",
      "250": "Песнь хвалы в темнице Павла и Силы свидетельствует о том, что узы не могут сковать свободный дух.",
      "251": "Во Христе мы — новое творение; старое прошло, теперь всё соделалось новым и чистым.",
      "252": "«Вот теперь день спасения»: благодать Божья не откладывает прощение на потом, она спасает сегодня.",
      "253": "Печаль ради Бога ведет к спасительному покаянию, не оставляющему никакого сожаления.",
      "254": "Щедрость спасенного сердца — прекрасный отблеск щедрости нашего Небесного Отца.",
      "255": "Нет иного евангелия: спасение дается только через веру в распятого и воскресшего Христа.",
      "256": "«Живу уже не я, но живет во мне Христос»: в этом заключается вся глубина праведности по вере.",
      "257": "Христос искупил нас от клятвы закона, сделавшись за нас клятвою на древе Голгофы.",
      "258": "Свобода во Христе возвышает человека до сыновства, освобождая от рабского страха перед буквой.",
      "259": "Духовные благословения во Христе дарованы нам прежде создания мира по неизведанной любви Отца.",
      "260": "Оживленные со Христом, мы посажены на небесах в Нем — таково наше истинное положение пред Богом.",
      "261": "Нисследимое богатство Христа покрывает все наши духовные нужды с избытком и переливом.",
      "262": "Единство Духа в союзе мира созидает подлинную Церковь живого Бога на земле.",
      "263": "Хождение во свете означает искреннее пребывание в лучах искупительной любви нашего Спасителя.",
      "264": "Всеоружие Божие — это Сам Христос. Облекаясь в Него, мы побеждаем любые козни лукавого.",
      "265": "Христос — глава Церкви и образ невидимого Бога. В Нем обитает вся полнота Божества телесно.",
      "266": "«Утешайте народ Мой!» — звучит весть 1888 года: ваши грехи прощены ради Его святого Имени.",

      "269": "День Господень для уповающих на Христа — не день ужаса, а долгожданный день избавления.",

      "271": "Господь посреди нас — Он силен спасти, Он безмолвствует от любви и торжествует над нами.",
      "272": "«Праведный верою жив будет»: это великое утверждение — краеугольный камень истинного христианства.",

      "327": "Слава второго храма превзошла первый, ибо в него вошел Сам Господь славы — Иисус Христос.",
      "328": "«Не силою и не воинством, но Духом Моим!»: вся духовная победа совершается Божьей силой.",
      "329": "Христос — наш вечный Царь и Первосвященник, соединяющий небо и землю в Своем искуплении.",
      "330": "Ликуй, Сион: твой Царь грядет кроткий, несущий оправдание, мир и вечное избавление.",
      "331": "Открытый источник для омытия греха и нечистоты ждет каждого жаждущего у подножия креста.",
      "332": "Хождение в истине и любви — естественный плод общения с живым и воскресшим Спасителем.",

      "337": "Созидание духовных стен совершается в соединении молитвы и несокрушимой силы Слова.",
      "338": "Радость пред Господом — наша несокрушимая сила во время любых жизненных штормов.",
      "339": "Исповедание благости Божьей наполняет сердце глубоким умиротворением и хвалой.",
      "340": "Покой и радость в общении с Богом превосходят любые временные наслаждения этого мира.",
      "341": "Сила веры сокрушает козни врага и открывает двери для обильных благословений свыше.",

      "343": "Праведность Божия через веру в Иисуса дается всем верующим без всяких исключений.",
      "344": "Вера Авраама вменилась ему в праведность. Так и наша вера во Христа делает нас праведными пред Богом.",
      "345": "Оправдавшись верой, мы имеем глубокий и нерушимый мир с Богом через Христа.",

    const PLAN = RAW_PLAN.map(day => ({
      ...day,
      note: NOTES[String(day.d)] || ''
    }));

    const TOTAL_DAYS = PLAN.length;
    const readingsOf = (day) => day.r.map(parseRef);
    const chaptersOf = (day) => readingsOf(day).reduce((sum, r) => sum + r.count, 0);
    const TOTAL_CHAPTERS = PLAN.reduce((sum, day) => sum + chaptersOf(day), 0);
    const dayByNumber = (n) => PLAN.find(d => d.d === n);

    const WEEKS = PLAN.reduce((weeks, day) => {
      const wNum = Math.ceil(day.d / 7);
      let week = weeks.find(item => item.week === wNum);
      if (!week) {
        week = { week: wNum, days: [] };
        weeks.push(week);
      }
      week.days.push(day);
      return weeks;
    }, []).map(w => ({
      ...w,
      from: w.days[0].d,
      to: w.days[w.days.length - 1].d,
    }));

    // Вычисление номера дня года, где 8 ноября принимается за День 1
    function getTodayDayNumber() {
      const now = new Date();
      // 8 ноября текущего года (месяц 10 — это ноябрь)
      const startDate = new Date(now.getFullYear(), 10, 8);
      
      // Если текущая дата раньше 8 ноября, можно считать от 8 ноября прошлого года, закольцовывая непрерывный годовой цикл
      if (now < startDate) {
        startDate.setFullYear(now.getFullYear() - 1);
      }
      
      const diff = now - startDate;
      const oneDay = 1000 * 60 * 60 * 24;
      const dayOffset = Math.floor(diff / oneDay);
      
      // Возвращает день от 1 до 365 с циклическим повторением
      return (dayOffset % TOTAL_DAYS) + 1;
    }

                                <button
                                  onClick={() => toggleDay(day)}
                                  className={`mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full border transition-colors cursor-pointer ${
                                    read ? 'border-transparent bg-[hsl(33,52%,40%)] text-white' : 'border-foreground/25 text-transparent hover:border-foreground/60'
                                  }`}
                                >
                                  {read && <span className="text-xs font-bold text-white">✓</span>}
                                </button>
                                <div
                                  onClick={() => { setSelectedDayNum(day.d); setTab('today'); }}
                                  className="min-w-0 flex-1 cursor-pointer"
                                >
                                  <div className="flex flex-wrap items-baseline gap-x-3 gap-y-1">
                                    <span className="w-8 shrink-0 text-xs tabular-nums text-muted-foreground">{day.d}</span>
                                    <span className={`font-display text-[1.05rem] leading-snug ${read ? 'text-muted-foreground line-through' : 'text-foreground'}`}>
                                      {day.t}
                                    </span>
                                  </div>
                                  <div className="mt-1 flex flex-wrap items-center gap-x-2 gap-y-1 pl-11">
                                    {readings.map((reading) => (
                                      <span key={reading.label} className="rounded-full bg-secondary/80 px-2.5 py-0.5 text-[11px] text-muted-foreground">
                                        {reading.label}
                                      </span>
                                    ))}
                                    <span className="text-[11px] tabular-nums text-muted-foreground/70">{chaptersOf(day)} гл.</span>
                                  </div>
                                </div>
                              </div>
                            </li>
                          );
                        })}
                      </ul>
                    </section>
                  ))
                )}
              </div>
            </main>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
