    function parseRef(ref) {
      const spaceIndex = ref.lastIndexOf(' ');
      const code = ref.slice(0, spaceIndex);
      const spec = ref.slice(spaceIndex + 1);
      const [fromRaw, toRaw] = spec.split('-');
      const from = Number(fromRaw);
      const to = toRaw ? Number(toRaw) : from;
      const book = BOOKS[code];
      const count = Math.max(0, to - from + 1);
      const chapters = from === to ? `${from}` : `${from}–${to}`;
      return {
        code,
        name: book ? book.name : code,
        from,
        to,
        count,
        chapters,
        label: `${book ? book.name : code} ${chapters}`,
        ref,
      };

   const NOTES = {
      "1": "Бог не требует от тьмы, чтобы она стала светом, — Он говорит, и свет есть. Так и оправдание: не человек поднимается к Богу исполнением, а Бог сходит словом и творит в нём сердце, способное отвечать. Родословие Матфея — перечень забытых, спорных и повреждённых имён, в который Бог вписывает Себя; благодать не ждёт чистой родословной, она её составляет. Псалмы первого дня ставят перед нами два пути и Помазанника — не систему правил, а Личность, в которой путь становится проходимым. Читайте эти строки не как устав, а как приглашение услышать голос, который и сейчас говорит свет.",
      "2": "Достоинство человека — не в силе, а в способности получать: он образ Того, Кто даёт. Светила, поставленные для времён и дней, напоминают, что порядок мира держится не нами. Второй псалом возвещает Сына, Которому дано наследие народов, а Матфей показывает, как этот Сын входит в мир через слабое, отверженное и опасное. Благодать всегда приходит так — не к нашей полноте, а к нашей пустоте.",
      "3": "Седьмой день — не награда за труд, а завершение, которое Бог даёт. Река, выходящая из Едема и делящаяся на четыре, говорит то же: жизнь течёт от присутствия, а не от усилия. Псалом четвёртый — вечерняя молитва человека, который знает себя и всё же засыпает в мире. Ирод ищет Царя и не находит, потому что ищет Его по своей мере; Иудея же получает ответ из Писания, которого не понимает.",
      "4": "«Помощник, соответственный ему» — первое слово о том, что спасение не совершается в одиночестве. Заповедь о дереве дана внутри сада, внутри изобилия: она охраняет дар, а не торгуется с ним. Псалом пятый — утренний голос того, кто знает свою неправду и всё равно входит в дом Божий «по множеству милости». Глас вопиющего в пустыне готовит путь не делам человека, а Тому, Кто идёт вместо него.",
      "5": "Змей начинает не с явного зла, а с сомнения в слове и в благости Говорящего. Грех входит как недоверие и только потом становится поступком. Псалом шестой — плач человека, который видит свою немощь и просит исцеления, а не оправдания. Крещение Иисуса показывает, где на самом деле совершается наше прощение: Он стоит в водах покаяния вместо нас и выходит из них с Духом без меры.",
      "6": "Первое искушение — превратить нужду в доказательство: «если Ты Сын, сделай». Христос отвечает Писанием не как оружием, а как доверием, и отказывается проверять любовь Отца. Изгнание из Едема с его херувимами и пламенным мечом встречается здесь лицом к лицу — и меч не поражает, потому что Искупитель пришёл вернуть путь. Псалом седьмой — молитва того, кто ищет убежища не в своей правоте, а в правде Божией.",
      "7": "Каин приносит дар, но приносит себя: он пытается сделать себя приемлемым и убивает брата, когда дар не оправдывает. Кровь Авеля говорит из земли как обвинение; кровь Христа говорит лучше — как ходатайство. Псалом восьмой ставит человека ниже ангелов и всё же венчает его славою, и это венчание совершается в Сыне человеческом. Выход в Капернаум — свет, восходящий «в стране тени смертной», то есть там, где света никто не ждёт.",
      "8": "После убийства рождается Сиф, и «тогда начали призывать имя Господне» — надежда пробивается через потерю, а не вместо неё. Псалом девятый — хвала Тому, Кто не оставляет ищущих Его. Блаженства не ступени вверх, а одно признание: Царство входит в человека, который перестал быть самодостаточным. Нищие духом не те, у кого ничего нет, а те, кто знает, что у них нет ничего своего.",
      "9": "Длинное родословие заканчивается одним и тем же словом — «умер». Закон, читаемый без Христа, делает именно это: перечисляет и завершает. Но Енох взят, и это первое свидетельство, что смерть не последнее слово для того, кто ходит с Богом. Пятая глава Матфея с её «если праведность ваша не превзойдёт» не поднимает планку, а снимает надежду на внешнюю правду, чтобы человек искал внутреннюю — Христову. Псалом девятый: «Господь будет убежищем угнетённому в годину скорби».",
      "10": "«Енох ходил с Богом» — не подвиг, а привычка близости, которая оказывается длиннее жизни. Слова о гневе и вожделении возвращают закон туда, где он и должен действовать: во внутренность, чтобы человек увидел нужду в Спасителе, а не повод для гордости. Псалом десятый описывает человека, который говорит «нет Бога» не устами, а жизнью. Имя Божие не остаётся пустым тогда, когда вся надежда человека помещается в нём.",
      "11": "Исполины — свидетельство того, что сила без благодати разрушает: чем больше способностей, тем страшнее падение. Псалом одиннадцатый говорит об основаниях, которые разрушены, и о праведном, уходящем к Господу; всякая надежда на человеческую прочность рано или поздно рушится. Христос переносит закон из внешнего суда в сердце и этим делает его непосильным для нас, чтобы мы приняли Его исполнение. Земля, растленная перед потопом, есть образ человека, который не видит своей нужды.",
      "12": "Ковчег строится по слову, а не по расчёту: спасение всегда конкретно, измеримо в послушании и всё же не наше по заслуге. Псалом двенадцатый — плач о том, что милостивых не стало, и обещание Бога восстать и защитить. Любить врагов не задача, а признак: человек, получивший незаслуженное, начинает раздавать незаслуженное. Совершенство Отца не образец для подражания, а источник жизни для тех, кто родился от Него.",
      "13": "Потоп — и суд над злом, и вода, которая поднимает ковчег: та же стихия губит и спасает, смотря по тому, есть ли на что встать. Молитва в тайне — правда о том, что вся наша праведность видима только Ему и только от Него. Псалом тринадцатый спрашивает «доколе?» и заканчивается хвалой ещё прежде ответа. Милостыня, о которой нельзя трубить, есть делание, у которого нет зрителя, кроме Отца.",
      "14": "Воды усиливаются, но ковчег ими же и поднят — то, что кажется концом, бывает средством перенесения. Псалмы четырнадцатый, пятнадцатый и шестнадцатый спрашивают, кто может обитать на святой горе, и отвечают не списком заслуг, а жизнью, текущей из присутствия; Пётр повторит эти слова о Христе. «Где сокровище ваше, там и сердце» — не призыв к финансовой дисциплине, а откровение о том, к чему человек привязан на самом деле. Око, светлое единством, видит всё в одном свете — свете Христа.",
      "15": "«Бог вспомнил» не значит, что память Его ослабла, а значит, что пришло время исполнения. Псалом шестнадцатый с его «я буду насыщаться образом Твоим» говорит о том, что человек утоляется не ответами, а лицом. «Не заботьтесь» — не беспечность, а доверие Отцу, Который знает нужды прежде прошения. И мера, которой мы мерим, есть мера нашей собственной нужды в милости, поэтому суд предоставлен Тому, Кто уже заплатил.",
      "16": "Убывающие воды и лист маслины — знак, что суд прошёл и жизнь вернулась не там, где её сажали. «Просите, ищите, стучите» — приглашение к отношениям, а не техника получения: просящий уже стоит перед Дверью, а не перед механизмом. Псалом семнадцатый — молитва человека, который говорит истину и всё же просит хранить его, потому что праведность его не его. «По плодам их узнаете» — не приговор другим, а честность о своём источнике.",
      "17": "Завет с Ноем не основан на его достоинстве: радуга поставлена в облаке, а не в человеке, и потому она не зависит от нашей верности. «Господи! Господи!» — исповедание без жизни, слово без основания; и беда не в слабости, а в отсутствии скалы. Прокажённый приходит с «если хочешь» и получает «хочу, очистись»: воля Божия о нас добрая, и это первое, что нужно узнать. Псалом восемнадцатый с его «возлюблю Тебя, Господи, крепость моя» — ответ на скалу, которую никто не построил сам.",
      "18": "Радуга — знак завета, обращённый и к нам, и к Самому Богу, и это делает спасение надёжным не с нашей стороны. Псалом восемнадцатый продолжает: «светильник мой, Господь просвещает тьму мою». Сотник понимает то, чего не поняли старейшины: власть исцелять не в силе просящего, а в слове Повелевающего. Потому и мы приходим не с правом, а с просьбой — и получаем больше, чем право.",
      "19": "Хам увидел наготу отца — так и закон видит наготу человека и не может её прикрыть; благословение же приходит к тем, кто покрывает. Псалом восемнадцатый говорит о бегущем враге и о Боге, Который выводит на пространное место, потому что благоволит. Буря на Галилейском море снимает с учеников всякую надежду на собственные силы, и на этом месте звучит вопрос о вере. Одержимые в стране Гергесинской показывают глубину, из которой никто не выходит сам.",
      "20": "Таблица народов говорит о единой крови и единой нужде: различия языков и границ не создают различия в грехе и в спасении. Псалом восемнадцатый завершается тем, что Бог возносит руку Свою над народами, — не наша проповедь ускоряет это, а Его обетование. Христос, видя веру, говорит прощение прежде исцеления, показывая порядок Царства: сначала мир с Богом, потом целость человека. Мытарь у сбора пошлин получает приглашение следовать, и это всё, что нужно для начала пути.",
      "21": "Псалом девятнадцатый ставит рядом небеса и закон: творение говорит о славе без слов, закон говорит о нужде словами; оба ведут ко Христу, но разными путями. Христос приходит не к праведным, а к тем, кто знает, что болен, и потому ест с мытарями. «Милости хочу, а не жертвы» — одно из ключевых слов всей вести 1888 года: Бог не ищет возмещения, Он ищет человека. Роды народов после потопа ищут имя себе, потому что потеряли имя, которое даётся свыше.",
      "22": "Стремление «сделать себе имя» — начало всякого самооправдания, и оно всегда заканчивается рассеянием. Псалмы двадцатый и двадцать первый показывают царя, который спасается не своей силой, а «силою Господа», и это единственное надёжное имя. Христос ставит мытаря выше фарисея, потому что один просит милости, а другой приносит отчёт. Сколько бы кирпичей ни было положено, ими не заменить того, что даётся даром.",
      "23": "Родословие Фарры бесплодно и заканчивается в Харране — там, где остановился отец Аврама, так и не дойдя до земли обетования. Псалом двадцать второй — молитва оставленного, которую произнесёт Христос на кресте; Церковь узнаёт в ней свой собственный голос. «Жатвы много, а делателей мало» — не о нехватке добровольцев, а о том, что Господь жатвы посылает, и посылает сострадательных. Из бесплодного выходит народ, потому что начало не в способности человека, а в слове призвания.",
      "24": "Бог не даёт Авраму карту, Он даёт Себя и обетование, а карта складывается по пути. Псалом двадцать второй говорит «я же червь, а не человек», и это не уничижение, а место, из которого Бог извлекает спасение. «Даром получили, даром давайте» — единственный закон, по которому живёт Царство. Родословие Аврама с его бесплодной Сарой и остановившимся отцом показывает, что Бог начинает с того, что не может продолжиться само.",
      "25": "Аврам строит жертвенник там, где явился Бог: не для того, чтобы удержать благословение, а в ответ на него. Голод и страх в Египте показывают, как быстро вера отступает перед нуждой, — и всё же Бог не отменяет обетования из-за слабости принявшего. Псалом двадцать второй говорит: «Он не презрел и не пренебрёг страданий страждущего», и это основание всякого жертвенника. Посланные как овцы среди волков сохраняются не хитростью, а тем, что Пастырь остаётся с ними.",
      "26": "Лот выбирает глазами и получает то, что было похоже на жизнь, но оказалось Содомом; Аврам отдаёт право выбора и получает обетование, потому что его часть — Бог. Псалом двадцать третий, «Господь пастырь мой», снимает страх и тесноты, и разделения. Христос посылает учеников как овец, зная, что Сам Он Пастырь и что этого достаточно. «Ученик не выше учителя» — не про запрет расти, а про то, что гонение за слово не означает ошибки в слове.",
      "27": "Благословение приходит к Авраму через Мелхиседека прежде закона и вне его — мысль, которую Послание к Евреям сделает основанием всей надежды. Священство по чину небесному не отменяет нужды человека, а отвечает ей. Псалом двадцать четвёртый говорит о тех, кто взойдёт на гору Господню, и о Царе славы, входящем в Свои врата. «Не мир пришёл Я принести, но меч» — о разделении, которое слово производит даже в самых близких, и о верности, которая выше родства.",
      "28": "Аврам отдаёт десятую часть из добычи, которую получил не он, — это признание, а не платёж и не страховка. Дар, отданный взамен дара, ничего не покупает у Бога; он только показывает, Кому принадлежит всё. Псалом двадцать пятый просит не о награде, а о пути и истине, и это самая важная просьба человека. Христос говорит, что меньший в Царстве больше Иоанна, показывая, что мера величия — не в достижении, а в положении рядом с Ним.",
      "29": "Здесь сердце всей вести: Аврам поверил Богу, и это вменилось ему в праведность — не как фикция, а как основание подлинной новой жизни. Вменение не делает человека лучше в глазах людей, оно делает его праведным в глазах Бога, и уже из этого произрастает послушание. «Щит тебе награда весьма великая» сказано прежде всякого дела, и слово о звёздах звучит ночью. Христос благословляет Отца за то, что Он утаил от мудрых и открыл младенцам, — потому что только младенцы верят обетованию.",
      "30": "Животные рассечены, но между частями проходит один Бог в образе дыма и огня: завет держится не на человеческом исполнении, а на Его верности. Это Евангелие прежде Евангелия, и всякий ужас и тьма Аврама не отменяют того, что обещано. Псалом двадцать шестой — единое желание, которое всё ставит на одно: «одного просил я у Господа». «Придите ко Мне все труждающиеся» — иго легкое, потому что несущий не я один.",
      "31": "Закон рождает раба, обетование — свободного: рабыня не отвергнута, но наследство даётся верующему.",
      "32": "Обрезание — печать праведности по вере, а не средство её получить.",
      "33": "«Есть ли что трудное для Господа?» — обетование не считается с бесплодием и возрастом.",
      "34": "Авраам торгуется о милости и узнаёт, что Бог милостивее его молитвы.",
      "35": "Суд начинается с дома Божия и не губит того, кого держат за руку.",
      "36": "Спасение Лота — не его стойкость, а рука, выводящая его из города.",
      "37": "Погибает не тот, кто в городе, а тот, кто сердцем ещё держится за него.",
      "38": "Бог хранит обетование даже тогда, когда его носитель поступает малодушно.",
      "39": "Исаак — не награда за терпение, а дар, который невозможно было заработать.",
      "40": "Два сына, две судьбы: свободный остаётся в доме, и дом этот — Христов.",
      "41": "Голос, который слышит Бог, — не голос достойного, а голос плачущего.",
      "42": "Бог не отнимает Исаака, но показывает, где на самом деле стоит сердце.",
      "43": "Агнец уготован прежде, чем занесён нож: замена приходит от Бога, а не от человека.",
      "44": "Авраам покупает землю для гроба: у веры есть место и в смерти.",
      "45": "Слуга не присваивает невесту: он приводит её и умаляется.",
      "46": "Для брака нужно лишь согласие невесты: дары идут впереди просьбы.",
      "47": "Невесту приглашают не на служение, а на вечерю — такова мера благодати.",
      "48": "Исаак выходит в поле первым: Христос приходит к Своей невесте раньше, чем она к Нему.",
      "49": "Писание замыкает всех под грехом, чтобы обетование дано было верующим.",
      "50": "Наследие продаётся не в час нужды, а в час неверия, что оно уже дано.",
      "51": "Немощь отца не отменяет обетования, данного сыну.",
      "52": "Спор о воде прекращается там, где находят воду живую.",
      "53": "Мир с людьми — плод мира с Богом, а не результат уступок.",
      "54": "Небо открывается над обманщиком в пустыне, а не над достойным в доме.",
      "55": "Обман получает слово, но не получает Духа: благословение без Благословляющего пусто.",
      "56": "Иаков обманывает и бежит — и здесь начинается путь, где Бог даёт ему другое имя.",
      "57": "Бог обещает прежде, чем человек обещает: порядок завета необратим.",
      "58": "Любовь считает годы служения немногими днями — такова мера благодати.",
      "59": "Бог возвращает человеку его собственную меру, чтобы тот перестал мерить.",
      "60": "Дети рождаются в соперничестве, но избирает Бог — не по борьбе, а по призванию.",
      "61": "Хитрость Иакова не отменяет того, что умножает Бог.",
      "62": "От призвания уйти нельзя: оно идёт за беглецом в чужую землю.",
      "63": "Бог предупреждает гонителя во сне, а не мстит руками гонимого.",
      "64": "Где нет доверия, там остаётся граница; но Бог остаётся по обе стороны.",
      "65": "Страх считает врагов, вера напоминает Богу Его же слова.",
      "66": "Иаков побеждает не силой, а упорством того, кто держится за Бога.",
      "67": "Новое имя даётся прежде примирения с братом: Бог оправдывает раньше, чем мы исправляем.",
      "68": "Алтарь ставится на месте, где мир ещё не наступил: поклонение идёт впереди согласия.",
      "69": "Ревность по чистоте без благодати становится жестокостью.",
      "70": "Победа мечом делает народ ненавидимым и не спасает ни одного.",
      "71": "Покаяние — не новый подвиг, а возвращение туда, где Бог говорил впервые.",
      "72": "Рахиль умирает, Вениамин рождается: в истории спасения жизнь идёт через скорбь, но не от неё.",
      "73": "Избрание — не оценка заслуг, а свобода Бога быть милостивым.",
      "74": "Бог любит не за масштаб, а по обетованию — и это единственное основание.",
      "75": "Разноцветная одежда и хитон без шва: Христос отдаёт одежду, чтобы одеть нас.",
      "76": "Присутствие Божие не ждёт возвышения: оно приходит в яму.",
      "77": "Рахиль плачет о детях — и плач остаётся молитвой до дня исполнения.",
      "78": "Родословие Христа проходит через эту главу: спасение вписано в нашу испорченную историю.",
      "79": "Признание Иуды — первое зерно его будущего ходатайства за Вениамина.",
      "80": "Чистота хранится не страхом людей, а словами «как сделаю я это великое зло».",
      "81": "Ограничен человек, а не слово: Бог остаётся с ним и в подлоге.",
      "82": "Тайна не покупается и не утаивается: она даётся тому, кто не приписывает её себе.",
      "83": "Ожидание длиннее памяти людей, но короче памяти Божией.",
      "84": "Сроки открываются тому, кто приписывает Богу и знание, и время.",
      "85": "Возвышение — не награда, а распоряжение: Бог ставит человека там, где нужна Его милость.",
      "86": "Братья приходят за хлебом к тому, кого продали: так Бог возвращает нас к нашей же вине.",
      "87": "Вина вспоминается через двадцать лет и становится первой молитвой.",
      "88": "Иосиф плачет прежде, чем открыться: милость торопится раньше объяснений.",
      "89": "Вениамин получает больше всех: благодать не уравнивает, она одевает.",
      "90": "Вина подброшена, и всё же она настоящая: так совесть узнаёт себя в чужом обвинении.",
      "91": "Иуда предлагает себя за Вениамина — первый ясный образ Заместителя.",
      "92": "Бог послал меня прежде вас, чтобы сохранить вам жизнь: так объясняется всякий путь.",
      "93": "Зло не становится добром, но Бог делает его средством спасения.",
      "94": "Бог говорит «не бойся идти»: путь в рабство тоже ведёт к обетованию.",
      "95": "Спасённые живут в чужой земле как гости, а не как хозяева.",
      "96": "Всякий голод приводит человека к тому, у кого есть хлеб.",
      "97": "Иаков благословляет младшего: избрание снова не по порядку и не по заслуге.",
      "98": "Благословение смотрит дальше умирающего: Лев обещан прежде, чем рождён.",
      "99": "Каждому — своё слово, но всем — один завет.",
      "100": "Иосиф завещает вынести его кости: надежда сильнее расстояния и смерти.",
      "101": "Благословение растёт не благодаря страху империи, а вопреки ему.",
      "102": "Страх Божий освобождает от страха человеческого.",
      "103": "Избавитель сохраняется в доме своего врага: Бог смеётся над указами.",
      "104": "Моисей выбирает страдать с народом Божиим, и это уже вера.",
      "105": "Место свято не от чистоты земли, а от присутствия: снимается обувь, а не решается дело.",
      "106": "«Я есмь» — не объяснение Бога, а обещание быть с тобой.",
      "107": "Бог не даёт Моисею красноречия, Он даёт Себя вместо него.",
      "108": "Прежде великого служения — послушание у собственного порога.",
      "109": "Упорство сердца не отменяет терпения Божия, а делает его видимым.",
      "110": "Когда послушание делает хуже, послушание всё равно остаётся путём.",
      "111": "Бог клянётся Собой, потому что больше нечем: на этом стоят наши основания.",
      "112": "Освобождение приходит через конкретную плоть, а не через идею.",
      "113": "Чудо не творит веры там, где уже решено не верить.",
      "114": "Та же вода поит и губит: суд есть любовь, встретившая упорство.",
      "115": "Отказ отпустить начинается с отказа признать очевидное.",
      "116": "«Помолитесь обо мне» — о снятии казни, а не о новом сердце.",
      "117": "Бог не только наказывает: Он отделяет, чтобы стало видно, под чьей рукой человек.",
      "118": "Град стихает не от доброты фараона, а ради тех, кто ещё может войти.",
      "119": "Тьма — не недостаток силы у Бога, а выбор человека.",
      "120": "Дом спасён не чистотой, а знаком на входе: Заместитель отмечен и принят.",
      "121": "Народ живёт из благодати прежде, чем получает свободу.",
      "122": "Освобождение начинается с приговора над ложной властью.",
      "123": "Бог ведёт не кратким путём, а спасительным.",
      "124": "«Господь будет воевать за вас» сказано прежде, чем море разверзлось.",
      "125": "Переход губит то, что уже было приговорено, и выводит тех, кто под кровью.",
      "126": "Первое слово спасённого — песня, а не обещание.",
      "127": "Дерево брошено в горькое — и воду можно пить.",
      "128": "Дар даётся на день, чтобы человек учился получать, а не владеть.",
      "129": "Каждый получил по нужде — единственное равенство в Царстве.",
      "130": "Камень — Христос, и удар по Нему не исчерпал жизни.",
      "131": "Молитва в вышине держит бой в долине.",
      "132": "Благодать принимает добрый совет и от людей вне Израиля.",
      "133": "Дело Божие не должно держаться на одном человеке.",
      "134": "Сначала «Я вынес вас», потом «слушайте голос Мой»: порядок завета неизменен.",
      "135": "Закон дан в огне и мраке, чтобы стало ясно: доступа нет, кроме Посредника.",
      "136": "Прелюдия закона — освобождение: заповеди дают спасённым, а не покупают спасение.",
      "137": "Закон не причина греха, а свет, в котором грех становится видимым.",
      "138": "Добровольное служение выше свободы, взятой для себя.",
      "139": "«Око за око» ограничивает месть, а не поощряет её.",
      "140": "Право собственности защищает того, кто не может защититься сам.",
      "141": "Мера благочестия — отношение к тем, кто не может ответить взаимностью.",
      "142": "«Будьте святы» стоит в ряду про жатву и плату: святость есть любовь к ближнему.",
      "143": "Праздники — не обязанность, а тень Того, Кто придёт.",
      "144": "Бог не только выводит, но и посылает Того, кто идёт прежде.",
      "145": "Кровь окропляет народ прежде, чем он успел нарушить: завет основан на будущем прощении.",
      "146": "Пока Моисей на горе, народ должен жить верой, а не зрелищем.",
      "147": "Народ делает бога из того, что дал Бог: так рождается всякая религия заслуг.",
      "148": "Слава на лице Моисея угасала; слава Христова пребывает и преображает.",
      "149": "«Милостив, долготерпелив» — имя, произнесённое после греха с тельцом.",
      "150": "Моисей просит не знамения, а лица: в этом вся нужда человека.",
      "151": "Земное устроено по небесному: тень достоверна, потому что указывает на реальность.",
      "152": "Светильник и хлебы в одном месте: слово и жизнь от одного Источника.",
      "153": "Двор отделяет, жертвенник соединяет.",
      "154": "Ходатай носит людей на плечах и на сердце.",
      "155": "Святость вменяется прежде, чем становится видимой.",
      "156": "Огонь принимает целое: жизнь отдаётся не частями.",
      "157": "Соль хранит дар от тления: завет не портится со временем.",
      "158": "Мир с Богом празднуется за трапезой.",
      "159": "Жертва выносится вне стана, чтобы стан оставался святым.",
      "160": "Покаяние возвращает больше, чем взяло.",
      "161": "Огонь поддерживается каждое утро: благодать нужна ежедневно.",
      "162": "Один умирает, другой уносит: жертва полна и вина удалена.",
      "163": "Христос вошёл в небесное святилище со Своей кровью — и раз и навсегда.",
      "164": "Тень обещала Приходящего, и потому ожидание было верой, а не обрядом.",
      "165": "Замещение не выдумано законом, оно установлено Богом.",
      "166": "Земля отдыхает, чтобы человек помнил: он не владелец.",
      "167": "Прощение долгов — не утопия, а порядок Царства.",
      "168": "Спасение приходит от того, кто имеет право, и совершается по любви.",
      "169": "Благословение и проклятие — не сделка, а описание двух путей.",
      "170": "Строгость завета — не месть, а лечение, которое не бывает приятным.",
      "171": "Обещанное рассматривают верой, а не глазами.",
      "172": "«Не можем» говорит плоть; «можем» — вера в Обещавшего.",
      "173": "Бог прощает и всё же ведёт: милость не отменяет пути.",
      "174": "Моисей стоит между народом и приговором — так действует ходатайство.",
      "175": "Избрание подтверждается жизнью, а не спором.",
      "176": "Даже тень очищения освящает: насколько больше кровь Христова.",
      "177": "Спасение — смотреть на Поднятого, а не на свою рану.",
      "178": "Бог говорит даже через того, кто не хотел слушать.",
      "179": "Дары призвания непреложны, даже когда народ недостоин.",
      "180": "Пророчество о Христе произнесено устами наёмника.",
      "181": "Любовь всем сердцем — не сумма дел, а ответ на услышанное.",
      "182": "Совершенная любовь изгоняет страх, оставляя благоговение.",
      "183": "Пустыня учит, что человек живёт не тем, что добыл.",
      "184": "Память о даре хранит от мысли «моя рука приобрела это».",
      "185": "Внешний знак без внутренней перемены становится защитой от Бога.",
      "186": "Беспристрастие Божие — основание милости к неимущему.",
      "187": "Проклятие закона снято Тем, кто стал проклятием за нас.",
      "188": "Бог обещает не систему, а Голос, которому можно верить.",
      "189": "Власть по Богу измеряется не тем, что взято, а тем, что отдано.",
      "190": "Слово веры близко: в устах и в сердце, а не на недостижимой высоте.",
      "191": "Ревность Божия не хочет гибели, она хочет возвращения.",
      "192": "Умирающий благословляет будущее, которого не увидит.",
      "193": "Повеление идти дано вместе с обещанием присутствия.",
      "194": "Спасение приходит к той, кто поверила прежде, чем увидела.",
      "195": "Вода расступается перед ковчегом, а не перед армией.",
      "196": "Память ставится камнями, чтобы дети спрашивали и слышали.",
      "197": "Прежде входа в землю снимается поношение: Бог начинает с сердца.",
      "198": "Манна прекращается, когда появляется хлеб земли: тень уступает реальности.",
      "199": "Стены падают от послушания, а не от осадной техники.",
      "200": "Свет ставится на горе, чтобы видели не нас, а Отца.",
      "201": "Один утаённый плащ делает стан неспособным стоять.",
      "202": "Ахор становится дверью надежды: суд Божий открывает путь.",
      "203": "Ни одно слово не осталось неисполненным — в этом и наша уверенность.",
      "204": "Свобода не в отсутствии выбора, а в возможности выбрать Бога.",
      "205": "Вера не передаётся кровью: каждое поколение принимает её само.",
      "206": "Избавители приходят не по достоинству народа, а по жалости Божией.",
      "207": "Бог побеждает рукой того, кого никто не считал воином.",
      "208": "Победа поётся низкими: Бог возвышает смирённых.",
      "209": "Бог избирает не сильного, чтобы сила была Его.",
      "210": "Сила уменьшена, чтобы стало ясно, чья победа.",
      "211": "Светильники в глиняных сосудах — образ служения, а не зрелища.",
      "212": "Кто хочет быть первым, служит — и это не лозунг, а природа Царства.",
      "213": "Слово, данное без понимания, связывает больше, чем освобождает.",
      "214": "Назорей — знак отделённости; сила его не в волосах, а в верности Бога.",
      "215": "Бог слышит молитву того, кто сам разрушил своё призвание.",
      "216": "Горькое имя Ноемини произнесено верой, а не бунтом.",
      "217": "Милость начинается с того, кто не имеет права на неё.",
      "218": "Выкуп совершается публично и добровольно — такова природа спасения.",
      "219": "Бог говорит ребёнку, потому что ищет не способного, а слушающего.",
      "220": "Сказать правду труднее, чем её услышать.",
      "221": "Святыня не служит опорой для самоуверенности.",
      "222": "Рядом с ковчегом всякий идол оказывается на полу.",
      "223": "Даже язычники признают руку Божию, когда она очевидна.",
      "224": "Покаяние — не чувство, а удаление чужих богов.",
      "225": "Просьба о царе — просьба о видимой опоре вместо невидимой.",
      "226": "Всякая власть являет своё сердце через то, что она берёт.",
      "227": "Бог даёт человекам другое сердце, а не только другое положение.",
      "228": "Замена послушания обрядом — самый благочестивый вид непослушания.",
      "229": "Бог смотрит на сердце и потому может избрать того, кого не видят люди.",
      "230": "Страх заразителен, но вера слышит другое имя.",
      "231": "Оружие веры простое, потому что сила не в нём.",
      "232": "Давид щадит помазанника, и этим показывает, кому принадлежит суд.",
      "233": "Погибель приходит не от силы врага, а от оставления Бога.",
      "234": "Давид оплакивает того, кто гнал его: любовь не зависит от ответа.",
      "235": "Царство принимается теми, кому дано право быть детьми.",
      "236": "Радость перед Богом не нуждается в одобрении зрителей.",
      "237": "Бог не нуждается в доме, но даёт человеку дом в Себе.",
      "238": "Обетование Давиду исполняется в Сыне, Которого не удержала смерть.",
      "239": "Пророк говорит притчу, и царь осуждает себя — так начинается покаяние.",
      "240": "Печаль по Богу ведёт к жизни; печаль мира сего — к смерти.",
      "241": "Бог даёт разум не за способности, а по просьбе сердца.",
      "242": "Дом строится не для того, чтобы удержать Бога.",
      "243": "Прощение просят заранее — Бог знает, что оно понадобится.",
      "244": "Падение начинается с сердца, разделённого при живом обетовании.",
      "245": "Огонь отвечает не на громкость, а на жертву.",
      "246": "После огня — веяние тихого ветра: Бог утешает прежде, чем посылает.",
      "247": "Открыто не новое оружие, а зрение: то, что было, стало видимым.",
      "248": "Слово, забытое в доме Божием, оживляет народ, когда его читают вслух.",
      "249": "Прославление — не завершение дела, а его начало.",
      "250": "Битва Господня требует не меча, а стояния.",
      "251": "Возвращение начинается с движения в сердце чужого царя.",
      "252": "Неемия плачет и молится прежде, чем говорит царю.",
      "253": "Труд и бодрствование вместе: вера не отменяет работы.",
      "254": "Бог не назван по имени, но действует в каждом совпадении.",
      "255": "Память о спасении становится праздником, а праздник — памятью.",
      "256": "Благочестие не страховка от боли, а отношение, которое боль проверяет.",
      "257": "Самая опасная теология — та, что защищает Бога от человека.",
      "258": "В глубине страдания рождается самое ясное исповедание Христа.",
      "259": "Ответом на боль становится не объяснение, а присутствие Говорящего.",
      "260": "Покаяние Иова — не о грехе, а о встрече: он увидел Бога.",
      "261": "Блаженство не в совете праведных, а в слове, которое они любят.",
      "262": "Творение и Писание говорят об одном, но спасает слово веры.",
      "263": "Господь ведёт через долину, а не вокруг неё.",
      "264": "Надежда Израиля — не в его бодрости, а в слове Господнем.",
      "265": "Слово не даёт карту всей дороги, но довольно для шага.",
      "266": "Бог смотрит на смирённых так, что они становятся способны петь.",
      "267": "Сокрушённый дух — единственная жертва, которую Бог не отвергает.",
      "268": "Страх Господень — не боязнь наказания, а трезвость перед лицом любви.",
      "269": "Полное доверие возможно лишь Тому, Кто уже доказал Свою волю.",
      "270": "Самообман не ощущается как обман, поэтому нужен свет извне.",
      "271": "Кроткий ответ сильнее убедительного доказательства.",
      "272": "Достоинство строится не на успехе, а на верности в повседневном.",
      "273": "Всё — пар, но принятое из руки Божией становится хлебом и радостью.",
      "274": "Итог мудрости — не вывод, а послушание.",
      "275": "Песнь любви — образ любви Христовой, которая не ищет своего.",
      "276": "Прощение не отложено до исправления: сначала очищение, потом научение.",
      "277": "Жизнь выходит из того, что уже не может дать жизни.",
      "278": "Погибель пророка — не приговор, а уголь, снятый с жертвенника.",
      "279": "Помазание даётся не для власти, а для утешения сокрушённых.",
      "280": "Кротость — способность пощадить надломленную трость.",
      "281": "Замещение — сердце Исаии 53 и всей вести 1888 года.",
      "282": "Праведный страдает за неправедных, и это не метафора.",
      "283": "Приглашение даётся без денег, и потому его нельзя заслужить.",
      "284": "Плен не отменяет плана: Бог работает и в чужой земле.",
      "285": "Закон, вписанный в сердце, — единственное исполнение закона.",
      "286": "Глина не спорит, но может оставаться мягкой — это и есть вера.",
      "287": "Слово сильнее желания молчать.",
      "288": "Среди развалин остаётся одно основание: милость Господня не истощилась.",
      "289": "Обетование не в том, что человек исправится, а в том, что Бог даст сердце.",
      "290": "Дух вдыхает жизнь в то, что уже не имеет надежды в себе.",
      "291": "Жизнь течёт от престола и всё делает живым на пути своём.",

    const PLAN = RAW_PLAN.map(day => ({

    const TOTAL_CHAPTERS = PLAN.reduce((sum, day) => sum + chaptersOf(day), 0);
    const dayByNumber = (n) => PLAN.find(d => d.d === n);

    const WEEKS = PLAN.reduce((weeks, day) => {
      const wNum = Math.ceil(day.d / 7);
      let week = weeks.find(item => item.week === wNum);
      if (!week) {
        week = { week: wNum, days: [] };
        weeks.push(week);
      }
      week.days.push(day);
      return weeks;
    }, []).map(w => ({
      ...w,
      from: w.days[0].d,
      to: w.days[w.days.length - 1].d,
    }));

    // Вычисление номера дня года, где 8 ноября принимается за День 1
    function getTodayDayNumber() {
      const now = new Date();
      // 8 ноября текущего года (месяц 10 — это ноябрь)
      const startDate = new Date(now.getFullYear(), 10, 8);
      
      // Если текущая дата раньше 8 ноября, можно считать от 8 ноября прошлого года, закольцовывая непрерывный годовой цикл
      if (now < startDate) {
        startDate.setFullYear(now.getFullYear() - 1);
      }
      
      const diff = now - startDate;
      const oneDay = 1000 * 60 * 60 * 24;
      const dayOffset = Math.floor(diff / oneDay);
      
      // Возвращает день от 1 до 365 с циклическим повторением
      return (dayOffset % TOTAL_DAYS) + 1;
    }

                      <button
                        onClick={() => setSelectedDayNum(todayDayNum)}
                        className="rounded-full border border-border px-3.5 py-1.5 text-xs text-muted-foreground transition-colors hover:border-foreground/40 hover:text-foreground cursor-pointer"
                      >
                        К текущему дню · {todayDayNum}
                      </button>
                    )}
                    <button
                      onClick={() => setSelectedDayNum(prev => Math.min(TOTAL_DAYS, prev + 1))}
                      disabled={currentDayObj.d === TOTAL_DAYS}
                      className="flex h-9 w-9 items-center justify-center rounded-full border border-border text-muted-foreground transition-colors hover:border-foreground/40 hover:text-foreground disabled:opacity-40 cursor-pointer"
                    >
                      →
                    </button>
                  </div>
                </div>

                <div className="mt-8 grid gap-10 lg:grid-cols-[minmax(0,1fr)_320px] lg:gap-14">
                  <DayCard
                    day={currentDayObj}
                    readings={readingsOf(currentDayObj)}
                    read={isRead(currentDayObj.d)}
                    onToggle={() => toggleDay(currentDayObj)}
                  />

                  <aside className="space-y-8">
                    <ProgressPanel
                      daysRead={readDays.length}
                      totalDays={TOTAL_DAYS}
                      chaptersRead={chaptersReadCount}
                      totalChapters={TOTAL_CHAPTERS}
                      setTab={setTab}
                    />
                    <div className="space-y-3">
                      <p className="text-[11px] uppercase tracking-[0.24em] text-muted-foreground">Как устроен план</p>
                      <p className="text-sm leading-relaxed text-muted-foreground">
                        Каждый день собирается из трёх-четырёх мест Писания: повествование Ветхого Завета, псалом или книга мудрости и отрывок Нового Завета. Они читаются вместе, потому что говорят об одном.
                      </p>
                    </div>
                  </aside>
                </div>
              </main>
            </>
          )}

          {currentTab === 'plan' && (
            <main className="mx-auto w-full max-w-4xl px-5 pb-24 pt-12 sm:px-8 sm:pt-16 flex-1">
              <p className="text-[11px] uppercase tracking-[0.28em] text-muted-foreground">Годовой план</p>
              <h1 className="mt-3 font-display text-[clamp(2rem,1.4rem+2vw,3rem)] leading-[1.1] tracking-title">Вся Библия, день за днём</h1>
              <p className="mt-4 max-w-xl text-sm leading-relaxed text-muted-foreground">
                {TOTAL_DAYS} дней и {TOTAL_CHAPTERS} глав. Каждый день — главы из далёких друг от друга книг, соединённые одной темой. Отмечайте прочитанное здесь или на странице дня.
              </p>

              <div className="mt-10 border-y border-border/70 py-4">
                <div className="flex flex-wrap items-center justify-between gap-4">
                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={() => setFilter('all')}
                      className={`rounded-full px-3.5 py-1.5 text-xs transition-colors cursor-pointer ${filter === 'all' ? 'bg-secondary text-foreground' : 'text-muted-foreground hover:text-foreground'}`}
                    >
                      Все дни
                    </button>
                    <button
                      onClick={() => setFilter('unread')}
                      className={`rounded-full px-3.5 py-1.5 text-xs transition-colors cursor-pointer ${filter === 'unread' ? 'bg-secondary text-foreground' : 'text-muted-foreground hover:text-foreground'}`}
                    >
                      Непрочитанные
                    </button>
                  </div>
                  <p className="text-xs tabular-nums text-muted-foreground">
                    {readDays.length} / {TOTAL_DAYS} дней · {chaptersReadCount} / {TOTAL_CHAPTERS} глав
                  </p>
                </div>

                <div className="mt-4 h-1 w-full overflow-hidden rounded-full bg-border/70">
                  <div
                    className="h-full rounded-full bg-[hsl(33,52%,40%)] transition-all duration-700 ease-out"
                    style={{ width: `${Math.round((readDays.length / TOTAL_DAYS) * 100)}%` }}
                  />
                </div>
              </div>

              <div className="mt-10 space-y-8">
                {filteredWeeks.length === 0 ? (
                  <p className="py-16 text-center font-display text-xl text-muted-foreground">Всё прочитано. Это был целый год.</p>
                ) : (
                  filteredWeeks.map((week) => (
                    <section key={week.week} className="border-t border-border/70 py-7 first:border-t-0 first:pt-0">
                      <div className="mb-4 flex items-baseline justify-between gap-4">
                        <h3 className="text-[11px] uppercase tracking-[0.24em] text-muted-foreground">
                          Неделя {week.week} · дни {week.days[0]?.d}–{week.days[week.days.length - 1]?.d}
                        </h3>
                        <span className="text-[11px] tabular-nums text-muted-foreground/80">
                          {week.days.filter(d => isRead(d.d)).length} / {week.days.length}
                        </span>
                      </div>
                      <ul className="space-y-1">
                        {week.days.map((day) => {
                          const readings = readingsOf(day);
                          const read = isRead(day.d);
                          return (
                            <li key={day.d}>
                              <div className="group flex items-start gap-3 rounded-xl px-2 py-3 transition-colors hover:bg-secondary/50">
                                <button
                                  onClick={() => toggleDay(day)}
                                  className={`mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full border transition-colors cursor-pointer ${
                                    read ? 'border-transparent bg-[hsl(33,52%,40%)] text-white' : 'border-foreground/25 text-transparent hover:border-foreground/60'
                                  }`}
                                >
                                  {read && <span className="text-xs font-bold text-white">✓</span>}
                                </button>
                                <div
                                  onClick={() => { setSelectedDayNum(day.d); setTab('today'); }}
                                  className="min-w-0 flex-1 cursor-pointer"
                                >
                                  <div className="flex flex-wrap items-baseline gap-x-3 gap-y-1">
                                    <span className="w-8 shrink-0 text-xs tabular-nums text-muted-foreground">{day.d}</span>
                                    <span className={`font-display text-[1.05rem] leading-snug ${read ? 'text-muted-foreground line-through' : 'text-foreground'}`}>
                                      {day.t}
                                    </span>
                                  </div>
                                  <div className="mt-1 flex flex-wrap items-center gap-x-2 gap-y-1 pl-11">
                                    {readings.map((reading) => (
                                      <span key={reading.label} className="rounded-full bg-secondary/80 px-2.5 py-0.5 text-[11px] text-muted-foreground">
                                        {reading.label}
                                      </span>
                                    ))}
                                    <span className="text-[11px] tabular-nums text-muted-foreground/70">{chaptersOf(day)} гл.</span>
                                  </div>
                                </div>
                              </div>
                            </li>
                          );
                        })}
                      </ul>
                    </section>
                  ))
                )}
              </div>
            </main>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
