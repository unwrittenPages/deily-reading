<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библия за год — Весть о праведности по вере</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #fdfbf7;
            --foreground: #2d2621;
            --card: #f7f2ea;
            --card-foreground: #2d2621;
            --primary: #5c4738;
            --primary-foreground: #fdfbf7;
            --secondary: #e6dfd3;
            --secondary-foreground: #2d2621;
            --muted: #e6dfd3;
            --muted-foreground: #6b6056;
            --accent: #d4a373;
            --border: #e8e1d5;
            --gold: #b07d3b;
            --radius: 0.75rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .font-display {
            font-family: 'Lora', Georgia, serif;
        }

        /* Шапка */
        header {
            position: sticky;
            top: 0;
            z-index: 30;
            border-bottom: 1px solid var(--border);
            background-color: rgba(253, 251, 247, 0.85);
            backdrop-filter: blur(8px);
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            height: 64px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-title {
            font-family: 'Lora', Georgia, serif;
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--foreground);
            text-decoration: none;
            letter-spacing: -0.015em;
        }

        .nav-links {
            display: flex;
            gap: 4px;
        }

        .nav-link {
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 0.875rem;
            color: var(--muted-foreground);
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-link.active {
            background-color: var(--secondary);
            color: var(--foreground);
            font-weight: 500;
        }

        .nav-link:hover:not(.active) {
            color: var(--foreground);
        }

        /* Контейнер */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* Hero секция */
        .hero-section {
            background-color: hsl(38, 34%, 93%);
            border-bottom: 1px solid var(--border);
            padding: 48px 0 32px 0;
            text-align: center;
            overflow: hidden;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .hero-subtitle {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.32em;
            color: var(--muted-foreground);
            margin-bottom: 20px;
        }

        .hero-title {
            font-family: 'Lora', Georgia, serif;
            font-size: clamp(2.5rem, 5vw, 4.2rem);
            line-height: 1.1;
            margin-bottom: 24px;
            color: var(--foreground);
        }

        .hero-description {
            font-family: 'Lora', Georgia, serif;
            font-size: clamp(1.05rem, 2vw, 1.35rem);
            font-style: italic;
            color: rgba(45, 38, 33, 0.85);
            max-width: 34rem;
            margin: 0 auto 32px auto;
            line-height: 1.7;
        }

        /* Галерея картинок */
        .hero-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            max-width: 1000px;
            margin: 40px auto 0 auto;
            padding: 0 24px;
            height: 320px;
        }

        .hero-frame {
            border-radius: 14px 14px 0 0;
            overflow: hidden;
            background: hsl(30, 18%, 22%);
            height: 100%;
        }

        .hero-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 35%;
        }

        /* Панель управления и сетка */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .view-title {
            font-family: 'Lora', Georgia, serif;
            font-size: 1.8rem;
            color: var(--primary);
        }

        .filters {
            display: flex;
            gap: 12px;
        }

        .filter-btn {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--foreground);
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--primary);
            color: var(--primary-foreground);
            border-color: var(--primary);
        }

        /* Сетка карточек плана */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.03);
        }

        .card.completed {
            background-color: #f3efe6;
            border-color: #d8cebc;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .day-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted-foreground);
            font-weight: 600;
        }

        .card-title {
            font-family: 'Lora', Georgia, serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--foreground);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .card-note {
            font-size: 0.9rem;
            color: var(--muted-foreground);
            font-style: italic;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            font-size: 0.8rem;
            color: var(--muted-foreground);
            border-top: 1px solid var(--border);
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(45, 38, 33, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            background: var(--background);
            border-radius: var(--radius);
            max-width: 650px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            flex: 1;
        }

        .modal-quote {
            background: var(--card);
            border-left: 3px solid var(--gold);
            padding: 16px 20px;
            border-radius: 0 var(--radius) var(--radius) 0;
            margin-bottom: 24px;
            font-family: 'Lora', Georgia, serif;
            font-style: italic;
            color: var(--primary);
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .reading-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
        }

        .btn {
            background: var(--primary);
            color: var(--primary-foreground);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--secondary-foreground);
        }

        @media (max-width: 768px) {
            .hero-gallery { grid-template-columns: 1fr; height: auto; }
            .hero-frame { height: 220px; margin-bottom: 10px; }
        }
    </style>
</head>
<body>

    <!-- Шапка приложения -->
    <header>
        <div class="header-inner">
            <a href="#" class="logo-title" onclick="switchView('today')">Библия за год</a>
            <nav class="nav-links">
                <a class="nav-link active" id="navToday" onclick="switchView('today')">Сегодня</a>
                <a class="nav-link" id="navPlan" onclick="switchView('plan')">План</a>
            </nav>
        </div>
    </header>

    <!-- Главная секция "Сегодня" (Hero) -->
    <div id="viewToday">
        <section class="hero-section">
            <div class="hero-content">
                <p class="hero-subtitle">365 дней · весть о праведности по вере</p>
                <h1 class="hero-title">Библия за год</h1>
                <p class="hero-description">
                    «Читай эту книгу не как историю и не как сборник притч — читай её как письмо от Того, кто мечтает увидеть Своё отражение в тебе.»
                </p>
                <button class="btn" onclick="openModal(currentDay)">Открыть сегодняшний день</button>
            </div>

            <div class="hero-gallery">
                <div class="hero-frame">
                    <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=800&q=80" alt="Открытая книга">
                </div>
                <div class="hero-frame" style="transform: translateY(12px);">
                    <img src="https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=800&q=80" alt="Ветви оливы">
                </div>
                <div class="hero-frame">
                    <img src="https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=800&q=80" alt="Записи">
                </div>
            </div>
        </section>
    </div>

    <!-- Секция "План" со всеми днями -->
    <div id="viewPlan" class="container" style="display: none;">
        <div class="section-header">
            <h2 class="view-title">План чтения на 365 дней</h2>
            <div class="filters">
                <button class="filter-btn active" id="filterAll" onclick="setFilter('all')">Все</button>
                <button class="filter-btn" id="filterUnread" onclick="setFilter('unread')">Непрочитанные</button>
                <button class="filter-btn" id="filterCompleted" onclick="setFilter('completed')">Прочитанные</button>
            </div>
        </div>
        <div class="grid" id="planGrid"></div>
    </div>

    <!-- Модальное окно дня -->
    <div class="modal-overlay" id="dayModal" onclick="closeModalOnOutside(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" style="font-family: 'Lora', serif; font-weight: 500; color: var(--primary);">День 1</h3>
                <button onclick="closeModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--muted-foreground);">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-quote" id="modalQuote"></div>
                <h4 style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted-foreground); margin-bottom: 12px;">Чтение Писания на сегодня:</h4>
                <div id="modalReadings"></div>
            </div>
            <div class="modal-footer">
                <button class="btn" id="modalCompleteBtn" onclick="toggleCompleteCurrent()">Отметить прочитанным</button>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-secondary" onclick="navigateDay(-1)">← Назад</button>
                    <button class="btn btn-secondary" onclick="navigateDay(1)">Вперед →</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Ваши полные данные заметок (notes-01.json, notes-02.json и т.д.)
        const notesData = {
            1: "Свет родился от слова, а не от усилия. Так и ты становишься новым — когда Он говорит.",
            2: "Сомнение в Его слове впустило грех; вера в то же слово возвращает тебя домой.",
            3: "Земля, полная плача, не брошена: Он вошёл в неё первым, чтобы найти тебя.",
            4: "Дверь ковчега закрыл не ты. Поэтому и спасение твоё не держится на твоей руке.",
            5: "Завет стоит на Его верности. Вот почему ты можешь перестать бояться за себя.",
            6: "Бог позвал не готового — Он позвал того, кто просто пошёл, и сделал его отцом веры.",
            7: "Вера живёт не там, где всё ясно, а там, где ясно одно: Он сказал — и этого достаточно.",
            8: "Всякий раз, когда ты торопишь Бога, ты репетируешь неверие. Обетование не опаздывает.",
            9: "Завет держится Ходатаем, а не твоей стойкостью.",
            10: "Торг о праведниках закончился крестом: праведность не торгуется — она даётся.",
            11: "Бог не просит у тебя того, что сначала не отдал Сам.",
            12: "Сердце находит дом не по расчёту, а по любви, которая пришла к нему первой.",
            13: "Ничто съеденное сегодня не стоит того, что Он приготовил тебе даром.",
            14: "Небо открыто над тобой не за твоё достоинство, а за Того, кто стоит на лестнице.",
            15: "В изгнании Он остаётся Богом завета: от Его верности нельзя уйти далеко.",
            16: "Бог уступает твоей борьбе, пока ты не согласишься быть благословлённым безоружным.",
            17: "Прощение идёт впереди твоей правоты — иначе правоты не выдержать.",
            18: "Он зовёт назад не для наказания, а чтобы напомнить, Кто возлюбил тебя первым.",
            19: "Зло не оправдано, но и оно не отменяет Его намерения спасти тебя.",
            20: "Ты праведен не тем, что видят люди, а Тем, кто видит тебя в темноте.",
            21: "Иосиф поднят не братьями — и ты возвышен не своей правотой, а Его.",
            22: "Покаяние начинается не с твоей боли, а с того, что ты увидел чужую.",
            23: "Прощение — не забыть, а отказаться держать цену за другого.",
            24: "Бог благословляет не по старшинству и не по ожиданиям, а по Своей милости.",
            25: "Надежда умирающих — в Том, кто не оставляет мёртвых.",
            26: "Мудрость выходит на улицу, чтобы позвать тебя таким, какой ты есть.",
            27: "Мудрость ищут усердно, а находят даром — как клад в поле.",
            28: "Он пришёл не к готовым, а к тем, кому был нужен Спасающий.",
            29: "Свет не награда за путь — он сам и есть путь.",
            30: "Он стал тобой, чтобы ты стал Им; Его победа в пустыне — твоя."
        };

        // Полный план чтения со смысловыми параллелями (из ваших файлов plan-01.json, plan-02.json и т.д.)
        const planItems = [
            { d: 1, t: "Творение и два пути", r: ["Быт 1-2", "Иов 1", "Пс 1"] },
            { d: 2, t: "Грех входит в мир", r: ["Быт 3-4", "Иов 2", "Пс 2"] },
            { d: 3, t: "Порча земли и первый плач", r: ["Быт 5-6", "Иов 3", "Пс 3"] },
            { d: 4, t: "Суд и спасение в ковчеге", r: ["Быт 7-8", "Иов 4", "Пс 4"] },
            { d: 5, t: "Завет радуги", r: ["Быт 9-10", "Иов 5", "Пс 5"] },
            { d: 6, t: "Вавилон и призвание Аврама", r: ["Быт 11-12", "Иов 6", "Пс 6"] },
            { d: 7, t: "Вера на чужой земле", r: ["Быт 13-14", "Иов 7", "Пс 7"] },
            { d: 8, t: "Обетование и нетерпение", r: ["Быт 15-16", "Иов 8", "Пс 8"] },
            { d: 9, t: "Завет и ходатайство", r: ["Быт 17-18", "Иов 9", "Пс 9"] },
            { d: 10, t: "Содом и торг о праведниках", r: ["Быт 19-20", "Иов 10"] },
            { d: 11, t: "Исаак: дар и жертва", r: ["Быт 21-22", "Иов 11"] },
            { d: 12, t: "Невеста для Исаака", r: ["Быт 23-24", "Иов 12"] },
            { d: 13, t: "Близнецы и цена первородства", r: ["Быт 25-26", "Иов 13"] },
            { d: 14, t: "Благословение и лестница в Вефиле", r: ["Быт 27-28", "Иов 14"] },
            { d: 15, t: "Иаков в Харране", r: ["Быт 29-30", "Иов 15"] },
            { d: 16, t: "Возвращение и борьба с Богом", r: ["Быт 31-32", "Иов 16"] },
            { d: 17, t: "Примирение и насилие", r: ["Быт 33-34", "Иов 17"] },
            { d: 18, t: "Возвращение в Вефиль", r: ["Быт 35-36", "Иов 18"] },
            { d: 19, t: "Иосиф продан", r: ["Быт 37-38", "Иов 19"] },
            { d: 20, t: "Верность в темнице", r: ["Быт 39-40", "Иов 20"] },
            { d: 21, t: "Возвышение Иосифа", r: ["Быт 41-42", "Иов 21"] },
            { d: 22, t: "Испытание братьев", r: ["Быт 43-44", "Иов 22"] },
            { d: 23, t: "Прощение и путь в Египет", r: ["Быт 45-46", "Иов 23"] },
            { d: 24, t: "Благословение сыновей", r: ["Быт 47-48", "Иов 24"] },
            { d: 25, t: "Последние слова и надежда", r: ["Быт 49-50", "Пс 10"] },
            { d: 26, t: "Мудрость зовёт на улицах", r: ["Пс 11", "Притч 1"] },
            { d: 27, t: "Поиск мудрости как серебра", r: ["Пс 12", "Притч 2"] },
            { d: 28, t: "Рождество обещанного", r: ["Пс 13", "Мф 1-2"] },
            { d: 29, t: "Путь жизни и свет", r: ["Пс 14", "Притч 3-4"] },
            { d: 30, t: "Крещение и искушение", r: ["Пс 15", "Мф 3-4"] }
        ];

        let currentDay = 1;
        let activeFilter = 'all';
        let completedDays = JSON.parse(localStorage.getItem('bible_completed_days')) || [];

        function switchView(view) {
            if (view === 'today') {
                document.getElementById('viewToday').style.display = 'block';
                document.getElementById('viewPlan').style.display = 'none';
                document.getElementById('navToday').classList.add('active');
                document.getElementById('navPlan').classList.remove('active');
            } else {
                document.getElementById('viewToday').style.display = 'none';
                document.getElementById('viewPlan').style.display = 'block';
                document.getElementById('navPlan').classList.add('active');
                document.getElementById('navToday').classList.remove('active');
                renderPlanGrid();
            }
        }

        function setFilter(filter) {
            activeFilter = filter;
            ['all', 'unread', 'completed'].forEach(f => {
                document.getElementById('filter' + f.charAt(0).toUpperCase() + f.slice(1)).classList.remove('active');
            });
            document.getElementById('filter' + filter.charAt(0).toUpperCase() + filter.slice(1)).classList.add('active');
            renderPlanGrid();
        }

        function renderPlanGrid() {
            const grid = document.getElementById('planGrid');
            grid.innerHTML = '';

            planItems.forEach(item => {
                const isCompleted = completedDays.includes(item.d);
                if (activeFilter === 'unread' && isCompleted) return;
                if (activeFilter === 'completed' && !isCompleted) return;

                const note = notesData[item.d] || "Бог совершает всё Своей благодатью в тебе.";
                const card = document.createElement('div');
                card.className = `card ${isCompleted ? 'completed' : ''}`;
                card.onclick = () => openModal(item.d);

                card.innerHTML = `
                    <div>
                        <div class="card-top">
                            <span class="day-badge">День ${item.d}</span>
                            <span style="font-size: 0.85rem;">${isCompleted ? '✅ Прочитано' : '⏳ Читать'}</span>
                        </div>
                        <div class="card-title">${item.t}</div>
                        <div class="card-note">«${note}»</div>
                    </div>
                    <div class="card-footer">
                        <span>Глав: ${item.r.join(', ')}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(dayNum) {
            currentDay = dayNum;
            const item = planItems.find(i => i.d === dayNum) || planItems[0];
            const note = notesData[dayNum] || "Бог совершает всё Своей благодатью в тебе.";

            document.getElementById('modalTitle').innerText = `День ${item.d} — ${item.t}`;
            document.getElementById('modalQuote').innerText = `«${note}»`;

            const readingsContainer = document.getElementById('modalReadings');
            readingsContainer.innerHTML = '';
            item.r.forEach(r => {
                const div = document.createElement('div');
                div.className = 'reading-item';
                div.innerHTML = `
                    <span style="font-weight: 500;">${r}</span>
                    <a href="https://bible.by/search/?q=${encodeURIComponent(r)}" target="_blank" style="color: var(--primary); text-decoration: none; font-size: 0.9rem;">Читать ↗</a>
                `;
                readingsContainer.appendChild(div);
            });

            updateModalButton();
            document.getElementById('dayModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function updateModalButton() {
            const btn = document.getElementById('modalCompleteBtn');
            if (completedDays.includes(currentDay)) {
                btn.style.background = '#8c7a6b';
                btn.innerText = 'Отменить отметку';
            } else {
                btn.style.background = 'var(--primary)';
                btn.innerText = 'Отметить прочитанным';
            }
        }

        function toggleCompleteCurrent() {
            if (completedDays.includes(currentDay)) {
                completedDays = completedDays.filter(d => d !== currentDay);
            } else {
                completedDays.push(currentDay);
            }
            localStorage.setItem('bible_completed_days', JSON.stringify(completedDays));
            updateModalButton();
            if (document.getElementById('viewPlan').style.display === 'block') {
                renderPlanGrid();
            }
        }

        function navigateDay(direction) {
            currentDay += direction;
            if (currentDay < 1) currentDay = planItems.length;
            if (currentDay > planItems.length) currentDay = 1;
            openModal(currentDay);
        }

        function closeModal() {
            document.getElementById('dayModal').style.display = 'none';
            document.body.style.overflow = '';
        }

        function closeModalOnOutside(e) {
            if (e.target.id === 'dayModal') {
                closeModal();
            }
        }
    </script>
</body>
</html>
